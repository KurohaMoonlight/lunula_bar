[package]
name = "lunula_bar"
version = "0.1.0"
edition = "2024"
description = "Ultra-lightweight GPU-accelerated Windows taskbar with Hokusai wave shaders"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glyphon = "0.12.0"
log = "0.4.35"
pollster = "1.0.1"
wgpu = "30.0.2"
winit = { version = "0.30.13", features = ["rwh_06"] }
chrono = "0.4.39"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimize heavy dependencies (wgpu, naga, glyphon, cosmic-text) even in `cargo run`
# while keeping crate compilation incremental and fast!
[profile.dev.package."*"]
opt-level = 2
